<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 逻辑密室闯关</title>
    <meta
      name="description"
      content="梅华中学2024级5班专属AI出题网页，支持查看答案与 30 秒倒计时。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-labelledby="app-title">
        <div class="topbar">
          <p class="eyebrow">梅华中学2024级5班专属AI</p>
          <nav class="page-tabs" aria-label="游戏分页">
            <button class="page-tab" type="button" data-bank="logic">
              <span class="tab-title">逻辑密室闯关</span>
              <span class="tab-subtitle">单人</span>
            </button>
            <button class="page-tab is-active" type="button" data-bank="folk">
              <span class="tab-title">节气民俗抢答</span>
              <span class="tab-subtitle">抢答</span>
            </button>
          </nav>
        </div>

        <section class="question-card" aria-live="polite">
          <div class="card-head">
            <div class="question-meta">
              <span class="label">当前题目</span>
              <strong id="question-id">--</strong>
            </div>
            <div class="timer" id="timer" aria-label="倒计时">30</div>
          </div>

          <p class="question" id="question-text">点击“AI请出题”开始。</p>

          <div class="answer-panel" id="answer-panel" hidden>
            <span class="label">标准答案</span>
            <p id="answer-text"></p>
          </div>

          <div class="actions">
            <button class="primary" id="draw-button" type="button">AI请出题</button>
            <button class="secondary" id="answer-button" type="button" disabled>查看答案</button>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
